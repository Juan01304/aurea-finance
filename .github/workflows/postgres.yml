name: Aurea PostgreSQL deploy test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurea
          POSTGRES_PASSWORD: aurea_test
          POSTGRES_DB: aurea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurea -d aurea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aurea:aurea_test@127.0.0.1:5432/aurea
      AUREA_HOST: 127.0.0.1
      AUREA_PORT: '8766'
      AUREA_SECRET: ci-postgres-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Start with PostgreSQL
        run: |
          python server.py > /tmp/aurea-pg.log 2>&1 &
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aurea-pg.log
          exit 1
      - name: Verify demo calculations on PostgreSQL
        run: |
          curl -fsS -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8766/demo/start >/tmp/demo.json
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8766/api/snapshot >/tmp/snapshot.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/snapshot.json'))['metrics']
          assert m['total_income'] == 2000.0, m
          assert m['committed'] == 1850.0, m
          assert m['suggested_save'] == 30.0, m
          assert m['safe_to_spend'] == 120.0, m
          print('PostgreSQL deploy path OK:', m)
          PY
      - if: failure()
        run: cat /tmp/aurea-pg.log || true
